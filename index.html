
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUADX KENO V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:white;font-family:Arial,sans-serif;padding:14px}
h1{text-align:center;color:#f5c542}
.card{background:#202633;padding:14px;border-radius:12px;margin:12px 0}
button{border:0;border-radius:8px;padding:10px;background:#e7b936;color:#111;font-weight:bold;margin:4px}
input{padding:10px;border-radius:7px;border:0;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.num{background:#394354;color:white;padding:9px 0;text-align:center;border-radius:6px;font-size:14px}
.num.selected{background:#e7b936;color:#111}
.num.hit{background:#20a66a;color:white}
.small{font-size:13px;color:#cbd1dc}
#drawn{display:flex;flex-wrap:wrap;gap:5px}
.draw{background:#e7b936;color:#111;padding:7px;border-radius:6px;font-weight:bold}
</style>
</head>
<body>
<h1>FUADX KENO V2</h1>

<div class="card">
  <div>የተጫዋች ስም</div>
  <input id="player" placeholder="ስም ያስገቡ">
  <p>COIN: <b id="coins">100</b></p>
  <p>የቲኬት ዋጋ: 2 COIN</p>
  <p>የተቀሩ ሰከንዶች: <b id="timer">60</b></p>
  <p id="status">ቁጥሮችዎን ይምረጡ</p>
</div>

<div class="card">
  <b>ቁጥሮች ይምረጡ (1–10)</b>
  <p class="small">ከ1 እስከ 10 ቁጥሮችን ይምረጡ።</p>
  <div class="grid" id="numbers"></div>
  <p>የመረጡት: <b id="chosen">0</b></p>
  <button onclick="saveTicket()">ቲኬት ይግዙ (2 COIN)</button>
</div>

<div class="card">
  <b>የእጣ ውጤት</b>
  <div id="drawn"></div>
</div>

<div class="card">
  <b>የእኔ ቲኬቶች</b>
  <div id="tickets"></div>
</div>

<script>
const rewards = {
3:{3:120,2:60,1:2},
4:{4:240,3:60,2:30,1:2},
5:{5:300,4:120,3:60,2:20,1:0},
6:{6:600,5:400,4:200,3:100,2:0,1:0},
7:{7:900,6:500,5:200,4:60,3:2,2:0,1:0},
8:{8:1200,7:900,6:600,5:300,4:60,3:2,2:0,1:0},
9:{9:1500,8:1000,7:600,6:300,5:100,4:2,3:0,2:0,1:0},
10:{10:2000,9:1500,8:1000,7:700,6:400,5:100,4:2,3:0,2:0,1:0}
};

let coins = Number(localStorage.getItem("fuadxCoins") || 100);
let selected = [];
let tickets = [];
let drawn = [];
let seconds = 60;
let phase = "select";
let interval = null;
let ticketResults = [];

const $ = id => document.getElementById(id);

function showCoins(){
  $("coins").textContent = coins;
  localStorage.setItem("fuadxCoins",coins);
}

function makeNumbers(){
  const area = $("numbers");
  area.innerHTML = "";
  for(let n=1;n<=80;n++){
    const b=document.createElement("button");
    b.className="num";
    b.textContent=n;
    b.onclick=()=>toggleNumber(n,b);
    area.appendChild(b);
  }
}

function toggleNumber(n,b){
  if(phase!=="select") return;
  if(selected.includes(n)){
    selected=selected.filter(x=>x!==n);
    b.classList.remove("selected");
  }else{
    if(selected.length>=10){alert("ከ10 ቁጥሮች በላይ መምረጥ አይቻልም");return;}
    selected.push(n);
    b.classList.add("selected");
  }
  $("chosen").textContent=selected.length;
}

function saveTicket(){
  const name=$("player").value.trim();
  if(!name){alert("እባክዎ ስም ያስገቡ");return;}
  if(phase!=="select"){alert("የምርጫ ጊዜ አልቋል");return;}
  if(selected.length<3){alert("ቢያንስ 3 ቁጥሮች ይምረጡ");return;}
  if(tickets.length>=10){alert("በአንድ ዙር እስከ 10 ቲኬቶች ብቻ ይቻላሉ");return;}
  if(coins<2){alert("በቂ COIN የለዎትም");return;}

  coins-=2;
  tickets.push({name,numbers:[...selected]});
  selected=[];
  showCoins();
  makeNumbers();
  $("chosen").textContent=0;
  showTickets();
}

function showTickets(){
  $("tickets").innerHTML="";
  tickets.forEach((t,i)=>{
    const p=document.createElement("p");
    p.textContent=(i+1)+". "+t.name+" : "+t.numbers.join(", ");
    $("tickets").appendChild(p);
  });
}

function startDraw(){
  phase="draw";
  drawn=[];
  $("status").textContent="ዕጣ እየወጣ ነው";
  $("drawn").innerHTML="";
  const pool=Array.from({length:80},(_,i)=>i+1);

  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }

  let index=0;
  const drawTimer=setInterval(()=>{
    if(index>=20){
      clearInterval(drawTimer);
      finishRound();
      return;
    }
    const n=pool[index++];
    drawn.push(n);
    const chip=document.createElement("span");
    chip.className="draw";
    chip.textContent=n;
    $("drawn").appendChild(chip);
  },1000);
}

function finishRound(){
  $("status").textContent="ዙሩ ተጠናቋል";
  let report="";
  tickets.forEach((t,i)=>{
    const hits=t.numbers.filter(n=>drawn.includes(n)).length;
    const reward=(rewards[t.numbers.length]||{})[hits]||0;
    coins+=reward;
    report+="ቲኬት "+(i+1)+": "+hits+"/"+t.numbers.length+" — "+reward+" COIN\n";
  });
  showCoins();
  alert("የዙሩ ውጤት:\n"+report);
  tickets=[];
  selected=[];
  showTickets();
  makeNumbers();
  setTimeout(newRound,3000);
}

function newRound(){
  phase="select";
  seconds=60;
  drawn=[];
  $("drawn").innerHTML="";
  $("status").textContent="አዲስ ዙር፤ ቁጥሮችን ይምረጡ";
  $("timer").textContent=seconds;
}

function tick(){
  if(seconds>0){
    seconds--;
    $("timer").textContent=seconds;
    return;
  }
  if(phase==="select"){
    startDraw();
    seconds=20;
    $("timer").textContent=20;
  }else{
    seconds=0;
  }
}

makeNumbers();
showCoins();
showTickets();
interval=setInterval(()=>{
  if(phase==="select"){
    tick();
  }else if(phase==="draw"){
    if(seconds>0){
      seconds--;
      $("timer").textContent=seconds;
    }
  }
},1000);
</script>
</body>
</html>
